name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Build every club file in clubs/, so a change that breaks one is caught
    # here rather than on that club's next deployment.
    strategy:
      fail-fast: false
      matrix:
        club: [example, wcc]
    env:
      CLUB: ${{ matrix.club }}

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Install dependencies
        uses: ./.github/actions/npm-install
      - name: Lint
        if: matrix.club == 'example'
        run: npm run lint
      - name: Build
        run: npm run build
