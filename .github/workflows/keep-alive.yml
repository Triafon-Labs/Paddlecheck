name: Keep Alive

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://paddlecheck.vercel.app' }}
        run: |
          echo "Pinging $SITE_URL"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE_URL")
          echo "Response status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Site returned unexpected status $status"
            exit 1
          fi
